id = "steward-argv"
name = "Steward argv pane"
version = "1"
min_herdr_version = "0.8.2"
description = "Argv-exec agent-steward into a new Herdr pane"
platforms = ["linux", "macos"]

[[panes]]
id = "argv"
title = "Steward"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/dispatch.sh\""]
